<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<style>
  :root{
    --navy:#0e1f3c;
    --navy-2:#16305c;
    --blue:#2f6fed;
    --blue-soft:#e8f0ff;
    --card:#ffffff;
    --bg:#f2f5fb;
    --text:#0e1f3c;
    --muted:#6b7a99;
    --line:#dde5f2;
    --cardio:#e8590c;
    --strength:#2f6fed;
    --flex:#0d9488;
    --ok:#16a34a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{
    background:linear-gradient(160deg,var(--navy),var(--navy-2));
    color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;
    border-radius:0 0 22px 22px;
  }
  header h1{margin:0;font-size:22px;letter-spacing:.2px}
  header p{margin:4px 0 0;color:#9fb6dd;font-size:13px}
  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{
    background:rgba(255,255,255,.14);border:0;color:#fff;font-size:14px;
    padding:7px 13px;border-radius:999px;cursor:pointer
  }
  main{flex:1;padding:16px 14px 28px}

  .card{
    background:var(--card);border-radius:18px;padding:16px;
    box-shadow:0 2px 10px rgba(14,31,60,.07);margin-bottom:12px;
  }
  button.card{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;cursor:pointer}
  button.card:active{transform:scale(.99)}
  .card h2{margin:0 0 6px;font-size:17px}
  .meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}

  .btn{
    display:block;width:100%;border:0;border-radius:14px;padding:15px;
    background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer;
  }
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--blue-soft);color:var(--navy)}
  .btn.dark{background:var(--navy)}

  ol.exercises{list-style:none;margin:0;padding:0}
  ol.exercises li{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  ol.exercises li:last-child{border-bottom:0}
  .num{
    flex:0 0 26px;height:26px;border-radius:50%;background:var(--blue-soft);
    color:var(--navy);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px
  }
  .ex-name{font-weight:600;font-size:15px}
  .ex-sub{color:var(--muted);font-size:13px;margin-top:3px}
  .tag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff;margin-right:8px
  }
  .tag.Cardio{background:var(--cardio)}
  .tag.Strength{background:var(--strength)}
  .tag.Flexibility{background:var(--flex)}

  /* session */
  .progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:14px}
  .progress > i{display:block;height:100%;background:var(--blue);transition:width .25s}
  .step-of{color:var(--muted);font-size:13px;text-align:center;margin-bottom:6px}
  .now{text-align:center;padding:22px 16px}
  .now h2{margin:8px 0 4px;font-size:24px;line-height:1.25}
  .timer{
    font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;
    margin:18px 0 6px;color:var(--navy)
  }
  .sets{display:flex;justify-content:center;gap:12px;margin:20px 0 6px}
  .dot{
    width:44px;height:44px;border-radius:50%;border:2px solid var(--line);
    display:grid;place-items:center;font-weight:700;color:var(--muted);background:#fff
  }
  .dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .next-up{color:var(--muted);font-size:13px;text-align:center;margin-top:14px}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}

  /* animated figure */
  .figwrap{
    position:relative;background:var(--blue-soft);border-radius:14px;
    margin:10px 0 4px;padding:6px;cursor:pointer;
  }
  .fig{display:block;width:100%;max-width:230px;margin:0 auto;height:auto}
  .fig .limb{fill:none;stroke:var(--navy);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .fig .head{fill:var(--navy)}
  .fig .floor{stroke:#b9c8e4;stroke-width:1.6;stroke-linecap:round}
  .figcap{
    position:absolute;right:10px;bottom:6px;font-size:10px;
    letter-spacing:.4px;text-transform:uppercase;color:var(--muted);
  }
  .figwrap.paused .fig{opacity:.55}
  .now .figwrap{max-width:280px;margin:12px auto 0}

  /* rest between sets */
  .rest{
    background:var(--blue-soft);border-radius:14px;padding:14px 12px;margin-top:4px;
  }
  .rest-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);font-weight:700;
  }
  .rest-clock{
    font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--navy);margin:2px 0 10px;
  }
  .restpick{
    display:block;margin-top:12px;font-size:13px;color:var(--muted);text-align:center;
  }
  .restpick select{
    font:inherit;font-size:13px;color:var(--navy);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:4px 6px;margin-left:4px;
  }

  /* how-to instructions */
  .howto{margin-top:8px}
  .howto summary{
    font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;
    list-style:none;padding:4px 0;
  }
  .howto summary::-webkit-details-marker{display:none}
  .howto summary::before{content:'ⓘ ';font-weight:400}
  .howto[open] summary{margin-bottom:4px}
  .howto h4{
    margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:700;
  }
  .howto ul{margin:0;padding-left:18px;list-style:disc}
  /* beats `ol.exercises li` so the bullets keep their markers and lose the dividers */
  .howto ul li, ol.exercises .howto ul li{
    display:list-item;list-style:disc;font-size:14px;line-height:1.5;
    color:var(--text);padding:2px 0;border-bottom:0;
  }
  .now .howto{text-align:left}
  .now .howto summary{text-align:center}

  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
  .hist{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist b{font-size:15px;font-weight:600;display:block}
  .hist span{color:var(--muted);font-size:13px}
  .section-title{margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
  .done-big{text-align:center;padding:30px 10px}
  .done-big .check{font-size:52px}
</style>
</head>
<body>
<div id="app"></div>

<script>

/* ---------------- how to perform each exercise ----------------
   Keyed by exercise name; duplicated exercises share one entry. */

  },

    exec: [

      'Reach towards your foot until you feel a stretch down the back of your thigh.',

/* ---------------- animated demonstrations ----------------
   Each exercise is drawn as a side-on stick figure built by forward
   kinematics from joint angles, then eased between two poses on a loop.
   Angles are degrees: 0 points straight down (limbs) or straight up
   (torso); positive rotates towards the front of the figure (+x).

   pose fields — hip:[x,y], torso, head, arm, fore, thigh, shin
   and optional arm2/fore2/thigh2/shin2 for a second, offset limb. */
const SEG = {torso:26, head:9, arm:13, fore:12, thigh:17, shin:16};
const rad = d => d * Math.PI / 180;

function skeleton(p){
  const [hx,hy] = p.hip;
  const t = rad(p.torso||0);
  const sh = [hx + SEG.torso*Math.sin(t), hy - SEG.torso*Math.cos(t)];
  const hd = rad((p.torso||0) + (p.head||0));
  const head = [sh[0] + SEG.head*Math.sin(hd), sh[1] - SEG.head*Math.cos(hd)];

  const limb = (from, a1, a2, l1, l2) => {
    const r1 = rad(a1), r2 = rad(a1 + a2);
    const mid = [from[0] + l1*Math.sin(r1), from[1] + l1*Math.cos(r1)];
    const end = [mid[0] + l2*Math.sin(r2), mid[1] + l2*Math.cos(r2)];
    return [mid, end];
  };

  const [el, hn]   = limb(sh, p.arm||0, p.fore||0, SEG.arm, SEG.fore);
  const [kn, ft]   = limb(p.hip, p.thigh||0, p.shin||0, SEG.thigh, SEG.shin);
  const arm2 = p.arm2 === undefined ? null : limb(sh, p.arm2, p.fore2||0, SEG.arm, SEG.fore);
  const leg2 = p.thigh2 === undefined ? null : limb(p.hip, p.thigh2, p.shin2||0, SEG.thigh, SEG.shin);
  return {head, sh, el, hn, hip:p.hip, kn, ft, arm2, leg2};
}

function lerpPose(a, b, t){
  const out = {};
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  keys.forEach(k => {
    const va = a[k], vb = b[k];
    if(va === undefined || vb === undefined){ out[k] = va === undefined ? vb : va; return; }
    out[k] = Array.isArray(va)
      ? va.map((n,i) => n + (vb[i]-n)*t)
      : va + (vb-va)*t;
  });
  return out;
}

/* two poses per exercise: the start and the finish of one repetition */
const ANIM = {

  'Bodyweight Squats': {poses:[

  'Crunches': {poses:[
    {hip:[52,86], torso:-70, head:-10, arm:-120, fore:-44, thigh:120, shin:-100},

  'Bicycle Crunches': {poses:[
    {hip:[52,86], torso:-52, head:-8, arm:-108, fore:-52, thigh:120, shin:-100, thigh2:66, shin2:-22},
    {hip:[52,86], torso:-52, head:-8, arm:-108, fore:-52, thigh:66, shin:-22, thigh2:120, shin2:-100}
  ], ms:900},

function figureSVG(id){
  return '<svg class="fig" id="'+id+'" viewBox="0 0 100 100" aria-hidden="true">' +
    '<line class="floor" x1="6" y1="92" x2="94" y2="92"/>' +
    '<circle class="head" r="7"/>' +
    '<polyline class="limb spine"/>' +
    '<polyline class="limb armA"/><polyline class="limb armB"/>' +
    '<polyline class="limb legA"/><polyline class="limb legB"/>' +
  '</svg>';
}

const players = [];
function stopPlayers(){ players.splice(0).forEach(id => clearInterval(id)); }

function playFigure(id, name){
  const a = ANIM[name];
  const svg = document.getElementById(id);
  if(!a || !svg) return;
  const q = s => svg.querySelector(s);
  const pts = arr => arr.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const t0 = performance.now();

  function frame(now){
    if(!svg.isConnected) return;
    // ping-pong with an ease so the turnarounds look like real reps
    const phase = ((now - t0) % (a.ms*2)) / a.ms;
    const raw = phase > 1 ? 2 - phase : phase;
    const t = raw < .5 ? 2*raw*raw : 1 - 2*(1-raw)*(1-raw);
    const s = skeleton(lerpPose(a.poses[0], a.poses[1], t));
    q('.head').setAttribute('cx', s.head[0].toFixed(1));
    q('.head').setAttribute('cy', s.head[1].toFixed(1));
    q('.spine').setAttribute('points', pts([s.sh, s.hip]));
    q('.armA').setAttribute('points', pts([s.sh, s.el, s.hn]));
    q('.legA').setAttribute('points', pts([s.hip, s.kn, s.ft]));
    q('.armB').setAttribute('points', s.arm2 ? pts([s.sh, ...s.arm2]) : '');
    q('.legB').setAttribute('points', s.leg2 ? pts([s.hip, ...s.leg2]) : '');
  }
  frame(t0);
  players.push(setInterval(() => frame(performance.now()), 50));
}

/* ---------------- storage ---------------- */
const KEY = 'workout-tracker.history.v1';
function loadHistory(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function saveHistory(h){
  try{ localStorage.setItem(KEY, JSON.stringify(h)); }catch(e){}
}

/* ---------------- helpers ---------------- */
const clock = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
function detail(ex){
  if(ex.type==='time') return clock(ex.seconds);
  if(ex.type==='hold') return ex.sets + ' sets × ' + ex.seconds + ' sec';
  return ex.sets + ' sets × ' + ex.reps + ' reps';
}
function durationText(s){
  const m = Math.round(s/60);
  return m < 1 ? 'under a minute' : m + ' min';
}
function dateText(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) +
    ' · ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- state ---------------- */
let view = {name:'list'};
let session = null;
let ticker = null;
const app = document.getElementById('app');

function go(next){ stopTicker(); stopPlayers(); view = next; render(); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker = null; } }

/* ---------------- views ---------------- */
function render(){
  if(view.name==='list') return renderList();
  if(view.name==='detail') return renderDetail(WORKOUTS.find(w=>w.id===view.id));
  if(view.name==='session') return renderSession();
  if(view.name==='summary') return renderSummary();
}

function shell(headerHTML, bodyHTML){
  app.innerHTML = '<header>'+headerHTML+'</header><main>'+bodyHTML+'</main>';
}

function renderList(){
  const history = loadHistory();
  const cards = WORKOUTS.map(w => `
    <button class="card" data-open="${w.id}">
      <h2>${esc(w.name)}</h2>
      <div class="meta">
        <span>${w.exercises.length} exercises</span>
        <span>~${w.minutes} min</span>
        <span>${esc(w.level)}</span>
      </div>
    </button>`).join('');

  const hist = history.length
    ? history.slice(0,15).map(h => `
        <div class="hist">
          <div><b>${esc(h.workoutName)}</b><span>${esc(dateText(h.date))}</span></div>
          <span>${esc(durationText(h.seconds))}</span>
        </div>`).join('')
    : '<div class="empty">No workouts logged yet. Finish one and it shows up here.</div>';

  shell(
    '<h1>Workout Tracker</h1><p>Bodyweight · no equipment</p>',
    cards +
    '<div class="section-title">History</div>' +
    '<div class="card">' + hist + '</div>' +
    (history.length ? '<button class="btn ghost" id="clear">Clear history</button>' : '')
  );

  app.querySelectorAll('[data-open]').forEach(b =>
    b.onclick = () => go({name:'detail', id:b.dataset.open}));
  const clear = document.getElementById('clear');
  if(clear) clear.onclick = () => {
    if(confirm('Delete all workout history?')){ saveHistory([]); render(); }
  };
}

let figSeq = 0;
function howtoHTML(name, open){
  const h = HOWTO[name];
  if(!h) return '';
  const list = arr => '<ul>' + arr.map(l => '<li>'+esc(l)+'</li>').join('') + '</ul>';
  const figId = 'fig-' + (figSeq++);
  const fig = ANIM[name] ? '<div class="figwrap" data-fig="'+figId+'" data-ex="'+esc(name)+'">' +
      figureSVG(figId) + '<span class="figcap">tap to pause</span></div>' : '';
  return '<details class="howto"'+(open ? ' open' : '')+' data-ex="'+esc(name)+'">' +
    '<summary>How to do it</summary>' +
    fig +
    '<h4>Starting position</h4>' + list(h.start) +
    '<h4>Execution</h4>' + list(h.exec) +
  '</details>';
}

function renderDetail(w){
  const items = w.exercises.map((ex,i) => `
    <li>
      <div class="num">${i+1}</div>
      <div>
        <div class="ex-name">${esc(ex.name)}</div>
        <div class="ex-sub"><span class="tag ${ex.cat}">${ex.cat}</span>${esc(detail(ex))}</div>
        ${howtoHTML(ex.name, false)}
      </div>
    </li>`).join('');

  shell(
    '<div class="backbar"><button class="back" id="back">‹ Workouts</button></div>' +
    '<h1>'+esc(w.name)+'</h1><p>'+w.exercises.length+' exercises · ~'+w.minutes+' min · '+esc(w.level)+'</p>',
    '<div class="card"><ol class="exercises">'+items+'</ol></div>' +
    '<button class="btn" id="start">Start Workout</button>'
  );

  wireFigures();
  document.getElementById('back').onclick = () => go({name:'list'});
  document.getElementById('start').onclick = () => startSession(w);
}

function startSession(w){
  session = {
    workout:w, index:0, setsDone:0,
    remaining:null, running:false,
    resting:false, restLeft:0,
    startedAt:Date.now()
  };
  go({name:'session'});
}

function currentEx(){ return session.workout.exercises[session.index]; }

function renderSession(){
  const w = session.workout, ex = currentEx();
  const pct = (session.index / w.exercises.length) * 100;
  const next = w.exercises[session.index+1];

  let body = '';
  if(ex.type === 'time'){
    if(session.remaining === null) session.remaining = ex.seconds;
    body = `
      <div class="timer">${clock(session.remaining)}</div>
      <div class="row">
        <button class="btn" id="toggle">${session.running ? 'Pause' : 'Start'}</button>
        <button class="btn ghost" id="reset">Reset</button>
      </div>`;
  } else if(ex.type === 'hold'){
    if(session.remaining === null) session.remaining = ex.seconds;
    body = `
      <div class="timer">${clock(session.remaining)}</div>
      ${dotsHTML(ex.sets)}
      ${session.resting ? restHTML() : `
        <div class="row">
          <button class="btn" id="toggle">${session.running ? 'Pause' : 'Start hold'}</button>
          <button class="btn ghost" id="setdone">Set done</button>
        </div>`}
      ${restPickerHTML()}`;
  } else {
    body = `
      ${dotsHTML(ex.sets)}
      ${session.resting ? restHTML() : `
        <button class="btn" id="setdone">
          ${session.setsDone >= ex.sets ? 'All sets complete' : 'Complete set ' + (session.setsDone+1) + ' of ' + ex.sets}
        </button>`}
      ${restPickerHTML()}`;
  }

  shell(
    '<div class="backbar"><button class="back" id="quit">‹ Quit</button></div>' +
    '<h1>'+esc(w.name)+'</h1><p>In progress</p>',
    '<div class="progress"><i style="width:'+pct+'%"></i></div>' +
    '<div class="step-of">Exercise '+(session.index+1)+' of '+w.exercises.length+'</div>' +
    '<div class="card now">' +
      '<span class="tag '+ex.cat+'">'+ex.cat+'</span>' +
      '<h2>'+esc(ex.name)+'</h2>' +
      '<div class="meta" style="justify-content:center">'+esc(detail(ex))+'</div>' +
      body +
    '</div>' +
    '<div class="card">' + howtoHTML(ex.name, true) + '</div>' +
    '<button class="btn dark" id="next">' +
      (session.index === w.exercises.length-1 ? 'Finish Workout' : 'Next Exercise') +
    '</button>' +
    (next ? '<div class="next-up">Up next: '+esc(next.name)+'</div>' : '')
  );

  document.getElementById('quit').onclick = () => {
    if(confirm('Quit this workout? Progress will not be saved.')){
      session = null; go({name:'list'});
    }
  };
  document.getElementById('next').onclick = advance;

  const toggle = document.getElementById('toggle');
  if(toggle) toggle.onclick = () => { session.running ? pause() : start(); };
  const reset = document.getElementById('reset');
  if(reset) reset.onclick = () => { pause(); session.remaining = ex.seconds; renderSession(); };
  const setdone = document.getElementById('setdone');
  if(setdone) setdone.onclick = () => {
    if(session.setsDone < ex.sets) session.setsDone++;
    if(ex.type === 'hold'){ pause(); session.remaining = ex.seconds; }
    // rest only when another set is still to come
    if(session.setsDone < ex.sets) startRest();
    renderSession();
  };

  const skip = document.getElementById('restskip');
  if(skip) skip.onclick = () => { stopRest(); renderSession(); };
  const add = document.getElementById('restadd');
  if(add) add.onclick = () => {
    session.restLeft += 15;
    const el = app.querySelector('.rest-clock');
    if(el) el.textContent = clock(session.restLeft);
  };
  const secs = document.getElementById('restsecs');
  if(secs) secs.onchange = () => {
    try{ localStorage.setItem(REST_KEY, secs.value); }catch(e){}
  };

  wireFigures();
  if(session.running && !ticker) tick();
}

/* ---------------- rest between sets ---------------- */
const REST_KEY = 'workout-tracker.rest.v1';
const REST_CHOICES = [30, 45, 60, 90];
function restSeconds(){
  const v = parseInt(localStorage.getItem(REST_KEY), 10);
  return REST_CHOICES.includes(v) ? v : 60;
}
function restHTML(){
  return '<div class="rest">' +
    '<div class="rest-label">Rest</div>' +
    '<div class="rest-clock">'+clock(session.restLeft)+'</div>' +
    '<div class="row">' +
      '<button class="btn ghost" id="restadd">+15s</button>' +
      '<button class="btn" id="restskip">Skip rest</button>' +
    '</div>' +
  '</div>';
}
function restPickerHTML(){
  const opts = REST_CHOICES.map(v =>
    '<option value="'+v+'"'+(v===restSeconds() ? ' selected' : '')+'>'+v+'s</option>').join('');
  return '<label class="restpick">Rest between sets ' +
    '<select id="restsecs">'+opts+'</select></label>';
}
function startRest(){
  session.resting = true;
  session.restLeft = restSeconds();
  restTick();
}
function stopRest(){
  session.resting = false;
  if(restTimer){ clearInterval(restTimer); restTimer = null; }
}
let restTimer = null;
function restTick(){
  if(restTimer) clearInterval(restTimer);
  restTimer = setInterval(() => {
    session.restLeft--;
    if(session.restLeft <= 0){
      stopRest();
      buzz();
      renderSession();
      return;
    }
    const el = app.querySelector('.rest-clock');
    if(el) el.textContent = clock(session.restLeft);
  }, 1000);
}

/* ---------------- figures ---------------- */
function wireFigures(){
  stopPlayers();
  app.querySelectorAll('.figwrap').forEach(wrap => {
    const id = wrap.dataset.fig, name = wrap.dataset.ex;
    const details = wrap.closest('details');
    if(!details || details.open) playFigure(id, name);
    wrap.onclick = () => {
      wrap.classList.toggle('paused');
      if(wrap.classList.contains('paused')){
        stopPlayers();
        // restart the others that are still meant to be running
        app.querySelectorAll('.figwrap:not(.paused)').forEach(o => {
          const d = o.closest('details');
          if(!d || d.open) playFigure(o.dataset.fig, o.dataset.ex);
        });
        wrap.querySelector('.figcap').textContent = 'tap to play';
      } else {
        playFigure(id, name);
        wrap.querySelector('.figcap').textContent = 'tap to pause';
      }
    };
  });
  app.querySelectorAll('details.howto').forEach(d => {
    d.addEventListener('toggle', () => wireFigures(), {once:true});
  });
}

function dotsHTML(sets){
  let d = '';
  for(let i=0;i<sets;i++)
    d += '<div class="dot'+(i < session.setsDone ? ' done' : '')+'">'+(i+1)+'</div>';
  return '<div class="sets">'+d+'</div>';
}

function start(){ session.running = true; tick(); renderSession(); }
function pause(){ session.running = false; stopTicker(); }

function tick(){
  stopTicker();
  ticker = setInterval(() => {
    session.remaining--;
    if(session.remaining <= 0){
      session.remaining = 0;
      pause();
      if(currentEx().type === 'hold' && session.setsDone < currentEx().sets){
        session.setsDone++;
        session.remaining = currentEx().seconds;
      }
      buzz();
      renderSession();
      return;
    }
    const el = app.querySelector('.timer');
    if(el) el.textContent = clock(session.remaining);
  }, 1000);
}

function buzz(){ if(navigator.vibrate) navigator.vibrate([120,60,120]); }

function advance(){
  pause();
  stopRest();
  if(session.index === session.workout.exercises.length - 1) return finish();
  session.index++;
  session.setsDone = 0;
  session.remaining = null;
  renderSession();
}

function finish(){
  const seconds = Math.round((Date.now() - session.startedAt)/1000);
  const entry = {
    date: new Date().toISOString(),
    workoutId: session.workout.id,
    workoutName: session.workout.name,
    seconds
  };
  const history = loadHistory();
  history.unshift(entry);
  saveHistory(history);
  go({name:'summary', entry});
}

function renderSummary(){
  const e = view.entry;
  shell(
    '<h1>Workout complete</h1><p>'+esc(e.workoutName)+'</p>',
    '<div class="card done-big">' +
      '<div class="check">✅</div>' +
      '<h2>Nice work</h2>' +
      '<div class="meta" style="justify-content:center">Time taken: '+esc(durationText(e.seconds))+'</div>' +
    '</div>' +
    '<button class="btn" id="home">Back to Workouts</button>'
  );
  document.getElementById('home').onclick = () => { session = null; go({name:'list'}); };
}

render();
</script>
